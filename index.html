
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff0f5">
  <meta name="description" content="Một món quà nhỏ chứa đầy tình yêu thương dành tặng mẹ nhân ngày 20/10.">
  <title>Gửi Mẹ Yêu Thương 💗</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      overflow-x: hidden;
      color: #78334f;
      font-family: Arial, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 10%, #fff 0, transparent 30%),
        linear-gradient(145deg, #fff4f7, #ffe0ec 55%, #fff8f2);
      min-height: 100vh;
    }

    button {
      font: inherit;
    }

    #petals {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .petal {
      position: absolute;
      top: -10vh;
      animation: fall linear infinite;
      opacity: 0.65;
      user-select: none;
    }

    @keyframes fall {
      to {
        transform: translate3d(60px, 115vh, 0) rotate(420deg);
      }
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 15px;
    }

    .card {
      width: min(680px, 100%);
      text-align: center;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid #fff;
      box-shadow: 0 22px 65px rgba(189, 98, 133, 0.17);
      border-radius: 28px;
      padding: clamp(22px, 5vw, 44px);
      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);
      position: relative;
    }

    .badge {
      display: inline-block;
      border-radius: 999px;
      background: #fff0f5;
      padding: 8px 14px;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: #b84d78;
      font-weight: 700;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      color: #b83f70;
      font-size: clamp(32px, 7vw, 52px);
      line-height: 1.12;
      margin: 18px 0 8px;
    }

    .subtitle {
      color: #a85a78;
      margin: 0 0 20px;
      line-height: 1.7;
    }

    .flower {
      font-size: clamp(42px, 9vw, 65px);
      letter-spacing: 5px;
      filter: drop-shadow(0 5px 7px rgba(232, 162, 186, 0.4));
      animation: sway 3s ease-in-out infinite;
      transform-origin: 50% 90%;
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }

    .envelope-wrap {
      margin: 22px auto 15px;
      min-height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .envelope {
      position: relative;
      width: 220px;
      height: 160px;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      filter: drop-shadow(0 10px 12px rgba(182, 91, 123, 0.2));
      transition: transform 0.25s;
      -webkit-tap-highlight-color: transparent;
    }

    .envelope:hover {
      transform: translateY(-4px);
    }

    .env-body {
      position: absolute;
      inset: 20px 0 0;
      background: #f6a9c4;
      border-radius: 8px;
      overflow: hidden;
      z-index: 3;
    }

    .env-body::before,
    .env-body::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 0;
      height: 0;
      border-style: solid;
    }

    .env-body::before {
      left: 0;
      border-width: 82px 110px 0 0;
      border-color: #fbd0df transparent transparent;
    }

    .env-body::after {
      right: 0;
      border-width: 82px 0 0 110px;
      border-color: #f4bfd2 transparent transparent;
    }

    .env-flap {
      position: absolute;
      top: 20px;
      left: 0;
      width: 0;
      height: 0;
      border-left: 110px solid transparent;
      border-right: 110px solid transparent;
      border-top: 78px solid #e887aa;
      transform-origin: top center;
      transition: transform 0.7s ease;
      z-index: 4;
    }

    .letter {
      position: absolute;
      z-index: 2;
      left: 18px;
      right: 18px;
      bottom: 10px;
      height: 104px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fffaf9;
      border-radius: 7px;
      padding: 12px;
      font-size: 25px;
      transition: transform 0.7s ease;
      box-shadow: 0 0 0 1px #f7dce6;
    }

    .letter small {
      font-size: 12px;
      color: #b83f70;
    }

    .envelope.open .env-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .envelope.open .letter {
      transform: translateY(-72px);
    }

    .hint {
      font-size: 14px;
      color: #a45d79;
      margin: 4px 0 20px;
      line-height: 1.6;
    }

    .letter-card {
      display: none;
      text-align: left;
      background: #fffafc;
      border: 1px solid #f8d6e2;
      border-radius: 18px;
      padding: 22px clamp(17px, 4vw, 30px);
      line-height: 1.85;
      box-shadow: inset 0 0 22px #fff0f5;
    }

    .letter-card.show {
      display: block;
      animation: appear 0.8s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .letter-card h2 {
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
      color: #b83f70;
      margin: 0 0 12px;
      font-size: clamp(22px, 5vw, 27px);
    }

    #typed {
      white-space: pre-line;
      overflow-wrap: anywhere;
      min-height: 150px;
    }

    .sign {
      display: block;
      width: 100%;
      text-align: right;
      color: #b83f70;
      font-family: Arial, "Segoe UI", sans-serif;
      font-size: clamp(18px, 4vw, 21px);
      font-weight: 500;
      margin-top: 14px;
      padding-right: 8px;
      letter-spacing: normal;
      word-spacing: normal;
      white-space: normal;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 22px;
    }

    button.action {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      background: #c95180;
      color: white;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 7px 16px rgba(201, 81, 128, 0.19);
      transition: transform 0.2s, background 0.2s;
    }

    button.action:hover {
      transform: translateY(-2px);
      background: #b83f70;
    }

    button.action.secondary {
      background: #fff0f5;
      color: #a43d69;
      border: 1px solid #f3c5d6;
      box-shadow: none;
    }

    button.action.secondary:hover {
      background: #ffe0ec;
    }

    button.action:focus-visible,
    .envelope:focus-visible {
      outline: 3px solid #a43d69;
      outline-offset: 4px;
    }

    footer {
      margin-top: 22px;
      font-size: 12px;
      line-height: 1.7;
      color: #b47790;
    }

    .heart {
      position: fixed;
      bottom: -30px;
      pointer-events: none;
      z-index: 4;
      animation: floatUp 4s ease-in forwards;
      user-select: none;
    }

    @keyframes floatUp {
      to {
        transform: translateY(-110vh) rotate(25deg);
        opacity: 0;
      }
    }

    @media (max-width: 420px) {
      main {
        padding: 16px 10px;
      }

      .card {
        border-radius: 22px;
        padding: 22px 16px;
      }

      .badge {
        font-size: 11px;
        letter-spacing: 0.04em;
      }

      .controls {
        flex-direction: column;
      }

      button.action {
        width: 100%;
      }

      .letter-card {
        padding: 18px 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="petals" aria-hidden="true"></div>

  <main>
    <section class="card">
      <div class="badge">20 · 10 &nbsp; | &nbsp; NGÀY PHỤ NỮ VIỆT NAM</div>

      <h1>Gửi Mẹ Yêu Thương</h1>

      <p class="subtitle">
        Có một món quà nhỏ con muốn gửi đến người tuyệt vời nhất 💗
      </p>

      <div class="flower" aria-hidden="true">🌷 🌸 🌷</div>

      <div class="envelope-wrap">
        <button
          class="envelope"
          id="envelope"
          type="button"
          aria-label="Mở phong thư"
          aria-expanded="false"
          aria-controls="letterCard"
        >
          <span class="env-body" aria-hidden="true"></span>
          <span class="letter" aria-hidden="true">
            💌
            <small>Gửi mẹ</small>
          </span>
          <span class="env-flap" aria-hidden="true"></span>
        </button>
      </div>

      <p class="hint" id="hint">
        Chạm vào phong thư để mở món quà nha mẹ ✨
      </p>

      <article class="letter-card" id="letterCard" aria-live="polite">
        <h2>Mẹ yêu của con! 💖</h2>
        <div id="typed"></div>
        <div class="sign">Con yêu mẹ nhiều lắm! 🌷</div>
      </article>

      <div class="controls">
        <button class="action" id="openBtn" type="button">
          Mở thư yêu thương 💌
        </button>

        <button class="action secondary" id="heartBtn" type="button">
          Gửi mẹ thật nhiều tim 💕
        </button>

        <button class="action secondary" id="resetBtn" type="button">
          Đọc lại từ đầu ↻
        </button>
      </div>

      <footer>
        Được làm bằng tất cả tình yêu dành cho mẹ · 20/10 💗
      </footer>
    </section>
  </main>

  <script>
    "use strict";

    const message = `Nhân ngày Phụ nữ Việt Nam 20/10, con muốn gửi đến mẹ những lời yêu thương chân thành nhất.

Cảm ơn mẹ vì đã luôn yêu thương, chăm sóc và hy sinh cho con. Có thể đôi khi con chưa biết cách nói ra, nhưng con luôn biết ơn vì được làm con của mẹ.

Con chúc mẹ luôn mạnh khỏe, vui vẻ, bình an và lúc nào cũng nở nụ cười thật tươi. Mong rằng mỗi ngày của mẹ đều có thật nhiều niềm vui, bởi mẹ xứng đáng nhận được những điều tốt đẹp nhất trên đời.

Con sẽ cố gắng trưởng thành hơn, chăm ngoan hơn và làm mẹ tự hào. Dù sau này con lớn đến đâu, mẹ vẫn luôn là người đặc biệt nhất trong trái tim con.`;

    const envelope = document.getElementById("envelope");
    const card = document.getElementById("letterCard");
    const typed = document.getElementById("typed");
    const hint = document.getElementById("hint");
    const petals = document.getElementById("petals");

    let typingTimer = null;
    let typingIndex = 0;
    let hasOpened = false;

    function stopTyping() {
      if (typingTimer !== null) {
        clearInterval(typingTimer);
        typingTimer = null;
      }
    }

    function startTyping() {
      stopTyping();
      typed.textContent = "";
      typingIndex = 0;

      typingTimer = setInterval(() => {
        typingIndex++;
        typed.textContent = message.slice(0, typingIndex);

        if (typingIndex >= message.length) {
          stopTyping();
        }
      }, 25);
    }

    function burstHearts(count) {
      const symbols = ["💗", "💖", "💕", "🌸", "🌷", "✨"];
      const fragment = document.createDocumentFragment();

      for (let i = 0; i < count; i++) {
        const heart = document.createElement("span");

        heart.className = "heart";
        heart.textContent =
          symbols[Math.floor(Math.random() * symbols.length)];

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = 16 + Math.random() * 22 + "px";
        heart.style.animationDuration = 2.5 + Math.random() * 2.5 + "s";

        fragment.appendChild(heart);

        heart.addEventListener("animationend", () => {
          heart.remove();
        }, { once: true });
      }

      document.body.appendChild(fragment);
    }

    function openLetter() {
      if (!hasOpened) {
        hasOpened = true;

        envelope.classList.add("open");
        envelope.setAttribute("aria-expanded", "true");
        card.classList.add("show");

        hint.textContent =
          "Một lá thư nhỏ, thật nhiều yêu thương dành cho mẹ 💗";

        startTyping();
        burstHearts(12);

        return;
      }

      // Nếu thư đã mở và đang gõ, bấm nút mở thư sẽ hiện toàn bộ lời chúc.
      if (typingTimer !== null) {
        stopTyping();
        typed.textContent = message;
      }

      burstHearts(5);
    }

    document.getElementById("openBtn").addEventListener("click", openLetter);

    envelope.addEventListener("click", () => {
      if (!hasOpened) {
        openLetter();
      } else {
        burstHearts(8);
      }
    });

    document.getElementById("heartBtn").addEventListener("click", () => {
      burstHearts(24);
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      stopTyping();

      hasOpened = false;
      typingIndex = 0;

      envelope.classList.remove("open");
      envelope.setAttribute("aria-expanded", "false");

      card.classList.remove("show");
      typed.textContent = "";

      hint.textContent =
        "Chạm vào phong thư để mở món quà nha mẹ ✨";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });

    // Tạo hoa và cánh hoa bay nhẹ nhàng.
    for (let i = 0; i < 18; i++) {
      const petal = document.createElement("span");

      petal.className = "petal";
      petal.textContent = ["🌸", "🌷", "💗"][i % 3];
      petal.style.left = Math.random() * 100 + "vw";
      petal.style.animationDuration = 9 + Math.random() * 13 + "s";
      petal.style.animationDelay = -(Math.random() * 20) + "s";
      petal.style.fontSize = 12 + Math.random() * 13 + "px";

      petals.appendChild(petal);
    }
  </script>
</body>
</html>
