<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff0f5">
<title>Gửi Mẹ Yêu Thương 💗 | 20/10</title>
<style>
:root{--pink:#f7a9c4;--deep:#b83f70;--cream:#fff8f7;--rose:#ffe0eb}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{overflow-x:hidden;color:#78334f;background:radial-gradient(circle at 20% 10%,#fff 0,transparent 30%),linear-gradient(145deg,#fff4f7,#ffe0ec 55%,#fff8f2);min-height:100vh}
#petals{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.petal{position:absolute;top:-10vh;animation:fall linear infinite;opacity:.65;font-size:20px}
@keyframes fall{to{transform:translate3d(60px,115vh,0) rotate(420deg)}}
main{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 15px}
.card{width:min(680px,100%);text-align:center;background:#ffffffd9;border:1px solid #fff;box-shadow:0 22px 65px #bd62852b;border-radius:28px;padding:clamp(22px,5vw,44px);backdrop-filter:blur(9px);position:relative}
.badge{display:inline-block;border-radius:999px;background:#fff0f5;padding:8px 14px;font-size:13px;letter-spacing:.08em;color:#b84d78;font-weight:700}
h1{font-family:Georgia,serif;color:#b83f70;font-size:clamp(32px,7vw,52px);line-height:1.12;margin:18px 0 8px}
.subtitle{color:#a85a78;margin:0 0 20px}
.flower{font-size:clamp(42px,9vw,65px);letter-spacing:5px;filter:drop-shadow(0 5px 7px #e8a2ba66);animation:sway 3s ease-in-out infinite;transform-origin:50% 90%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.envelope-wrap{margin:22px auto 15px;min-height:170px;display:flex;align-items:center;justify-content:center}
.envelope{position:relative;width:220px;height:140px;border:0;background:transparent;cursor:pointer;filter:drop-shadow(0 10px 12px #b65b7b35);transition:transform .25s}
.envelope:hover{transform:translateY(-4px)}
.env-body{position:absolute;inset:20px 0 0;background:#f6a9c4;border-radius:8px;overflow:hidden}
.env-body:before,.env-body:after{content:"";position:absolute;bottom:0;width:0;height:0;border-style:solid}
.env-body:before{left:0;border-width:82px 110px 0 0;border-color:#fbd0df transparent transparent}
.env-body:after{right:0;border-width:82px 0 0 110px;border-color:#f4bfd2 transparent transparent}
.env-flap{position:absolute;top:20px;left:0;width:0;height:0;border-left:110px solid transparent;border-right:110px solid transparent;border-top:78px solid #e887aa;transform-origin:top;transition:transform .7s;z-index:4}
.letter{position:absolute;z-index:2;left:18px;right:18px;bottom:10px;height:104px;background:#fffaf9;border-radius:7px;padding:12px;font-size:25px;transition:transform .7s;box-shadow:0 0 0 1px #f7dce6}
.envelope.open .env-flap{transform:rotateX(180deg);z-index:0}
.envelope.open .letter{transform:translateY(-72px)}
.hint{font-size:14px;color:#a45d79;margin:4px 0 20px}
.letter-card{display:none;text-align:left;background:#fffafc;border:1px solid #f8d6e2;border-radius:18px;padding:22px clamp(17px,4vw,30px);line-height:1.85;box-shadow:inset 0 0 22px #fff0f5;animation:appear .8s ease}
.letter-card.show{display:block}
@keyframes appear{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.letter-card h2{text-align:center;font-family:Georgia,serif;color:#b83f70;margin:0 0 12px;font-size:27px}
#typed{white-space:pre-line;min-height:150px}

.sign {
    text-align: right;
    color: #b83f70;
    font-family: Arial, sans-serif;
    font-size: 21px;
    font-weight: 500;
    margin-top: 14px;
    letter-spacing: 0;
    word-spacing: 0;
    white-space: normal;
    line-height: 1.6;
}

.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
button.action{border:0;border-radius:999px;padding:12px 18px;background:#c95180;color:white;font-weight:700;cursor:pointer;box-shadow:0 7px 16px #c9518030}
button.action.secondary{background:#fff0f5;color:#a43d69;border:1px solid #f3c5d6;box-shadow:none}
button.action:focus-visible,.envelope:focus-visible{outline:3px solid #a43d69;outline-offset:4px}
footer{margin-top:22px;font-size:12px;color:#b47790}
.heart{position:fixed;bottom:-30px;pointer-events:none;z-index:4;animation:floatUp 4s ease-in forwards}
@keyframes floatUp{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="petals" aria-hidden="true"></div>
<main>
<section class="card">
  <div class="badge">20 · 10 &nbsp; | &nbsp; NGÀY PHỤ NỮ VIỆT NAM</div>
  <h1>Gửi Mẹ Yêu Thương</h1>
  <p class="subtitle">Có một món quà nhỏ con muốn gửi đến người tuyệt vời nhất 💗</p>
  <div class="flower" aria-hidden="true">🌷 🌸 🌷</div>
  <div class="envelope-wrap">
    <button class="envelope" id="envelope" aria-label="Mở phong thư" aria-expanded="false">
      <span class="env-body"></span><span class="letter">💌<br><small style="font-size:12px;color:#b83f70">Gửi mẹ</small></span><span class="env-flap"></span>
    </button>
  </div>
  <p class="hint" id="hint">Chạm vào phong thư để mở món quà nha mẹ ✨</p>
  <article class="letter-card" id="letterCard" aria-live="polite">
    <h2>Mẹ yêu của con! 💖</h2>
    <div id="typed"></div>
    <div class="sign">Con yêu mẹ nhiều lắm! 🌷</div>
  </article>
  <div class="controls">
    <button class="action" id="openBtn">Mở thư yêu thương 💌</button>
    <button class="action secondary" id="heartBtn">Gửi mẹ thật nhiều tim 💕</button>
    <button class="action secondary" id="resetBtn">Đọc lại từ đầu ↻</button>
  </div>
  <footer>Được làm bằng tất cả tình yêu dành cho mẹ · 20/10 💗</footer>
</section>
</main>
<script>
const message = `Nhân ngày Phụ nữ Việt Nam 20/10, con muốn gửi đến mẹ những lời yêu thương chân thành nhất.

Cảm ơn mẹ vì đã luôn yêu thương, chăm sóc và hy sinh cho con. Có thể đôi khi con chưa biết cách nói ra, nhưng con luôn biết ơn vì được làm con của mẹ.

Con chúc mẹ luôn mạnh khỏe, vui vẻ, bình an và lúc nào cũng nở nụ cười thật tươi. Mong rằng mỗi ngày của mẹ đều có thật nhiều niềm vui, bởi mẹ xứng đáng nhận được những điều tốt đẹp nhất trên đời.

Con sẽ cố gắng trưởng thành hơn, chăm ngoan hơn và làm mẹ tự hào. Dù sau này con lớn đến đâu, mẹ vẫn luôn là người đặc biệt nhất trong trái tim con.`;
const envelope=document.getElementById('envelope');
const card=document.getElementById('letterCard');
const typed=document.getElementById('typed');
const hint=document.getElementById('hint');
let typingTimer=null;
function openLetter(){
  envelope.classList.add('open'); envelope.setAttribute('aria-expanded','true');
  card.classList.add('show'); hint.textContent='Một lá thư nhỏ, thật nhiều yêu thương dành cho mẹ 💗';
  clearInterval(typingTimer); typed.textContent='';
  let i=0;
  typingTimer=setInterval(()=>{typed.textContent=message.slice(0,i++);if(i>message.length)clearInterval(typingTimer)},25);
  burstHearts(12);
}
document.getElementById('openBtn').addEventListener('click',openLetter);
envelope.addEventListener('click',()=>{if(!card.classList.contains('show'))openLetter();else burstHearts(8)});
document.getElementById('heartBtn').addEventListener('click',()=>burstHearts(24));
document.getElementById('resetBtn').addEventListener('click',()=>{
 clearInterval(typingTimer); envelope.classList.remove('open');envelope.setAttribute('aria-expanded','false');
 card.classList.remove('show');typed.textContent='';hint.textContent='Chạm vào phong thư để mở món quà nha mẹ ✨';
 window.scrollTo({top:0,behavior:'smooth'});
});
function burstHearts(n){const symbols=['💗','💖','💕','🌸','🌷','✨'];for(let i=0;i<n;i++){const e=document.createElement('span');e.className='heart';e.textContent=symbols[Math.floor(Math.random()*symbols.length)];e.style.left=Math.random()*100+'vw';e.style.fontSize=(16+Math.random()*22)+'px';e.style.animationDuration=(2.5+Math.random()*2.5)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),5200)}}
const petals=document.getElementById('petals');
for(let i=0;i<18;i++){const e=document.createElement('span');e.className='petal';e.textContent=['🌸','🌷','💗'][i%3];e.style.left=Math.random()*100+'vw';e.style.animationDuration=(9+Math.random()*13)+'s';e.style.animationDelay=(-Math.random()*20)+'s';e.style.fontSize=(12+Math.random()*13)+'px';petals.appendChild(e)}
</script>
</body>
</html>
